name: Diagnostyka Windows

on:
  push:
    branches: ['diag/**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - name: Test wykrywania folderów
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib diag -- --ignored --nocapture
      - name: Wynik
        if: always()
        shell: pwsh
        run: |
          $f = "src-tauri/diag.txt"
          if (Test-Path $f) { $t = Get-Content $f -Raw } else { $t = "brak pliku diag.txt" }
          $t = $t.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::notice title=diag::$t"
      - name: Budowa aplikacji (debug, z wbudowanym interfejsem)
        continue-on-error: true
        run: npx tauri build --debug --no-bundle
      - name: Test całej aplikacji z karteczką przy folderze
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $data = "C:\KarteczkiData"
          New-Item -ItemType Directory -Force "$data\notes" | Out-Null
          New-Item -ItemType Directory -Force "C:\KarteczkiTest\Klienci" | Out-Null
          $cfg = Join-Path $env:APPDATA "pl.grocjusz.karteczki"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          @{ dataDir = $data; firstRunDone = $true } | ConvertTo-Json | Set-Content -Encoding utf8 "$cfg\settings.json"
          $note = @{ id = "test1"; title = "Przy folderze"; html = "<p>Widać mnie?</p>"; color = "yellow"; archived = $false; trashedAt = $null; createdAt = 1; updatedAt = 2; attach = "C:\KarteczkiTest\Klienci" }
          $note | ConvertTo-Json | Set-Content -Encoding utf8 "$data\notes\test1.json"
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices; using System.Collections.Generic;
          public static class W {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P f, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h, out int pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Ri, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            public static string List(int pid) {
              var sb = new StringBuilder();
              EnumWindows((h, l) => { int p; GetWindowThreadProcessId(h, out p); if (p == pid) { var t = new StringBuilder(256); GetWindowText(h, t, 256); R r; GetWindowRect(h, out r);
                sb.AppendFormat("  okno {0} '{1}' widoczne={2} rect=({3},{4},{5},{6})\n", h, t, IsWindowVisible(h), r.L, r.T, r.Ri, r.B); } return true; }, IntPtr.Zero);
              return sb.ToString();
            }
            public static string Fg() { var h = GetForegroundWindow(); int p; GetWindowThreadProcessId(h, out p); var t = new StringBuilder(256); GetWindowText(h, t, 256); return h + " pid=" + p + " '" + t + "'"; }
          }
          "@
          $exe = "src-tauri\target\debug\karteczki.exe"
          $out = "exe istnieje: $(Test-Path $exe)`n"
          $p = Start-Process $exe -PassThru
          Start-Sleep 10
          $out += "Po starcie (pid $($p.Id)), pierwszy plan: $([W]::Fg())`n$([W]::List($p.Id))"
          Start-Process explorer.exe "C:\KarteczkiTest\Klienci"
          Start-Sleep 8
          $out += "Po otwarciu folderu, pierwszy plan: $([W]::Fg())`n$([W]::List($p.Id))"
          $out += "Czy proces żyje: $(-not $p.HasExited)`n"
          $out = $out.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::notice title=app::$out"
      - name: Test przypięcia w trakcie pracy (karteczka z pulpitu, polskie znaki, Dokumenty)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-Process karteczki -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -ne '' } | ForEach-Object { }
          $data = "C:\KarteczkiData"
          Remove-Item "$data\notes\*" -Force -ErrorAction SilentlyContinue
          $pl = "C:\KarteczkiTest\Zażółć Klienci"
          $docs = [Environment]::GetFolderPath('MyDocuments') + "\Umowy"
          New-Item -ItemType Directory -Force $pl, $docs | Out-Null
          $cfg = Join-Path $env:APPDATA "pl.grocjusz.karteczki"
          '{"test2":{"x":50,"y":500,"w":300,"h":300,"onTop":false}}' | Set-Content -Encoding utf8 "$cfg\karteczki-na-pulpicie.json"
          function Note($id, $attach, $upd) {
            $n = @{ id = $id; title = $id; html = "<p>$id</p>"; color = "yellow"; archived = $false; trashedAt = $null; createdAt = 1; updatedAt = $upd; attach = $attach }
            $n | ConvertTo-Json | Set-Content -Encoding utf8 "$data\notes\$id.json"
          }
          Note "test1" $null 2
          Note "test2" $null 2
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class W2 {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P f, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h, out int pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Ri, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            public static string List(int pid) {
              var sb = new StringBuilder();
              EnumWindows((h, l) => { int p; GetWindowThreadProcessId(h, out p); if (p == pid) { var t = new StringBuilder(256); GetWindowText(h, t, 256);
                if (t.ToString() == "Karteczka") { R r; GetWindowRect(h, out r); sb.AppendFormat("  karteczka {0} widoczna={1} rect=({2},{3},{4},{5})\n", h, IsWindowVisible(h), r.L, r.T, r.Ri, r.B); } } return true; }, IntPtr.Zero);
              return sb.ToString();
            }
            public static string Fg() { var h = GetForegroundWindow(); var t = new StringBuilder(256); GetWindowText(h, t, 256); R r; GetWindowRect(h, out r); return "'" + t + "' rect=(" + r.L + "," + r.T + "," + r.Ri + "," + r.B + ")"; }
          }
          "@
          $p = Start-Process "src-tauri\target\debug\karteczki.exe" -PassThru
          Start-Sleep 10
          $out = "1) start, test2 na pulpicie. Pierwszy plan: $([W2]::Fg())`n$([W2]::List($p.Id))"
          Note "test1" $pl 5000
          Note "test2" $docs 5000
          Start-Sleep 4
          $out += "2) po przypięciu obu do folderów (zmiana plików w trakcie pracy):`n$([W2]::List($p.Id))"
          Start-Process explorer.exe "`"$pl`""
          Start-Sleep 7
          $out += "3) otwarty folder z polskimi znakami. Pierwszy plan: $([W2]::Fg())`n$([W2]::List($p.Id))"
          Start-Process explorer.exe "`"$docs`""
          Start-Sleep 7
          $out += "4) otwarty Dokumenty\Umowy. Pierwszy plan: $([W2]::Fg())`n$([W2]::List($p.Id))"
          Start-Process notepad.exe
          Start-Sleep 5
          $out += "5) Notatnik na wierzchu. Pierwszy plan: $([W2]::Fg())`n$([W2]::List($p.Id))"
          $out += "proces żyje: $(-not $p.HasExited)`n"
          $out = $out.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::notice title=app2::$out"
      - name: Test pracy w tle (zamknięcie okna krzyżykiem)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-Process karteczki -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $data = "C:\KarteczkiData"
          Remove-Item "$data\notes\*" -Force -ErrorAction SilentlyContinue
          $cfg = Join-Path $env:APPDATA "pl.grocjusz.karteczki"
          '{}' | Set-Content -Encoding utf8 "$cfg\karteczki-na-pulpicie.json"
          $dir = "C:\KarteczkiTest\Tlo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $n = @{ id = "tlo"; title = "tlo"; html = "<p>tlo</p>"; color = "yellow"; archived = $false; trashedAt = $null; createdAt = 1; updatedAt = 2; attach = $dir }
          $n | ConvertTo-Json | Set-Content -Encoding utf8 "$data\notes\tlo.json"
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class W3 {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P f, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h, out int pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern IntPtr PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static IntPtr Find(int pid, string title) { IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { int p; GetWindowThreadProcessId(h, out p); var t = new StringBuilder(256); GetWindowText(h, t, 256); if (p == pid && t.ToString() == title) { found = h; return false; } return true; }, IntPtr.Zero); return found; }
            public static string State(int pid) { var sb = new StringBuilder();
              EnumWindows((h, l) => { int p; GetWindowThreadProcessId(h, out p); var t = new StringBuilder(256); GetWindowText(h, t, 256); var s = t.ToString();
                if (p == pid && (s == "Karteczki" || s == "Karteczka")) sb.AppendFormat("  '{0}' widoczne={1}\n", s, IsWindowVisible(h)); return true; }, IntPtr.Zero); return sb.ToString(); }
          }
          "@
          $exe = "src-tauri\target\debug\karteczki.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep 10
          $out = "1) po starcie:`n$([W3]::State($p.Id))"
          $main = [W3]::Find($p.Id, "Karteczki")
          [W3]::PostMessage($main, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          Start-Sleep 3
          $out += "2) po krzyżyku (WM_CLOSE): proces żyje=$(-not $p.HasExited)`n$([W3]::State($p.Id))"
          Start-Process explorer.exe $dir
          Start-Sleep 7
          $out += "3) po otwarciu folderu:`n$([W3]::State($p.Id))"
          Start-Process $exe
          Start-Sleep 5
          $out += "4) po ponownym kliknięciu ikony: procesów karteczki=$((Get-Process karteczki).Count)`n$([W3]::State($p.Id))"
          $p2 = Start-Process $exe -ArgumentList "--autostart" -PassThru
          $out = $out.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::notice title=tlo::$out"
