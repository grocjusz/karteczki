name: Budowa instalatora

on:
  push:
    branches: [main, 'rozwoj/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalacja zależności
        run: npm ci

      - name: Testy interfejsu
        run: npm test

      - name: Budowa interfejsu
        run: npm run build

      - name: Testy rdzenia
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test uruchomienia (czy okno odpowiada)
        shell: pwsh
        run: |
          npx tauri build --debug --no-bundle
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $data = "C:\KarteczkiSmoke"
          New-Item -ItemType Directory -Force "$data\notes" | Out-Null
          $cfg = Join-Path $env:APPDATA "pl.grocjusz.karteczki"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          @{ dataDir = $data; firstRunDone = $true } | ConvertTo-Json | Set-Content -Encoding utf8 "$cfg\settings.json"
          $n = @{ id = "smoke"; title = "Test"; html = "<p>Test</p>"; color = "yellow"; archived = $false; trashedAt = $null; createdAt = 1; updatedAt = 2 }
          $n | ConvertTo-Json | Set-Content -Encoding utf8 "$data\notes\smoke.json"
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class S {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P f, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h, out int pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsHungAppWindow(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, IntPtr w, IntPtr l, uint f, uint t, out IntPtr r);
            public static IntPtr Main(int pid) { IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { int p; GetWindowThreadProcessId(h, out p); var t = new StringBuilder(64); GetWindowText(h, t, 64); if (p == pid && t.ToString() == "Karteczki" && IsWindowVisible(h)) { found = h; return false; } return true; }, IntPtr.Zero); return found; }
            public static bool Responds(IntPtr h) { IntPtr r; return SendMessageTimeout(h, 0, IntPtr.Zero, IntPtr.Zero, 2, 3000, out r) != IntPtr.Zero && !IsHungAppWindow(h); }
          }
          "@
          $p = Start-Process "src-tauri\target\debug\karteczki.exe" -PassThru
          Start-Sleep 15
          $h = [S]::Main($p.Id)
          $ok = (-not $p.HasExited) -and ($h -ne [IntPtr]::Zero) -and [S]::Responds($h)
          Start-Sleep 5
          $ok = $ok -and [S]::Responds($h)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Output "::error::Karteczki nie odpowiadają po uruchomieniu (okno=$h, zakończony=$($p.HasExited))"; exit 1 }
          Write-Output "Okno Karteczek odpowiada."

      - name: Numer wersji i czy wydanie już istnieje
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Budowa i publikacja wydania
        if: steps.ver.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Karteczki __VERSION__
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseBody: |
            **Jak zainstalować**
            1. Pobierz plik `Karteczki_${{ steps.ver.outputs.version }}_x64-setup.exe` (niżej, w sekcji Assets).
            2. Uruchom go. Jeśli Windows pokaże niebieskie okno „System Windows ochronił komputer”, kliknij **Więcej informacji**, a potem **Uruchom mimo to**.
            3. Gotowe — Karteczki są w menu Start. Możesz je przypiąć do paska zadań (prawy przycisk → Przypnij do paska zadań).

            Aktualizacja: zainstaluj nową wersję na starą. Notatki zostają.

      - name: Budowa kontrolna (bez publikacji)
        if: steps.ver.outputs.exists == 'true' || github.ref != 'refs/heads/main'
        run: npx tauri build --bundles nsis

      - name: Instalator jako artefakt
        if: steps.ver.outputs.exists == 'true' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: karteczki-instalator
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
