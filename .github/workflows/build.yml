name: Budowa instalatora

on:
  push:
    branches: [main, 'rozwoj/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalacja zależności
        run: npm ci

      - name: Testy interfejsu
        run: npm test

      - name: Budowa interfejsu
        run: npm run build

      - name: Testy rdzenia
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Numer wersji i czy wydanie już istnieje
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Budowa i publikacja wydania
        if: steps.ver.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Karteczki __VERSION__
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseBody: |
            **Jak zainstalować**
            1. Pobierz plik `Karteczki_${{ steps.ver.outputs.version }}_x64-setup.exe` (niżej, w sekcji Assets).
            2. Uruchom go. Jeśli Windows pokaże niebieskie okno „System Windows ochronił komputer”, kliknij **Więcej informacji**, a potem **Uruchom mimo to**.
            3. Gotowe — Karteczki są w menu Start. Możesz je przypiąć do paska zadań (prawy przycisk → Przypnij do paska zadań).

            Aktualizacja: zainstaluj nową wersję na starą. Notatki zostają.

      - name: Budowa kontrolna (bez publikacji)
        if: steps.ver.outputs.exists == 'true' || github.ref != 'refs/heads/main'
        run: npx tauri build --bundles nsis

      - name: Instalator jako artefakt
        if: steps.ver.outputs.exists == 'true' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: karteczki-instalator
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
